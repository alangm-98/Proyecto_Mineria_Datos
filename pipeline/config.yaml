# =====================================================================
# Pagos Lumen · E2 · Configuración del pipeline
#
# Todos los parámetros del pipeline viven aquí: nombres de proyecto,
# datasets y tablas, supuestos, semilla y umbrales. El código no tiene
# valores escritos a mano. Para ejecutar en otro proyecto de Google Cloud
# basta con cambiar `proyecto.id` (ver README, sección «Proyecto propio»).
#
# Los parámetros que todavía no se fijan se marcan como «pendiente» con
# la fase del plan en que se deciden.
# =====================================================================

proyecto:
  id: pagos-lumen-dw
  ubicacion: US # los cuatro datasets deben estar en la misma ubicación

datasets:
  staging: lumen_staging # datos crudos; el pipeline solo lee de aquí
  prep: lumen_prep # capa de preparación: dataset analítico y tablas intermedias
  dw: lumen_dw # esquema estrella de E1
  mart: lumen_mart # vistas del DataMart de E1

# Tablas de staging que usa el pipeline. Las de 14 días cargadas en E1
# (ieee_train_transaction, ieee_train_identity) se conservan como evidencia
# de esa entrega y el pipeline no las usa.
staging:
  ieee_transaccion: ieee_train_transaction_completa
  ieee_identidad: ieee_train_identity_completa
  banxico: banxico_cf621_series
  ulb: ulb_fraud_detection
  dominios: free_email_domains

# Tablas que el pipeline crea en la capa de preparación (datasets.prep).
tablas_prep:
  analitico_crudo: analitico_crudo # A unida al grano de E1, sin limpiar (entrada del EDA)
  banxico_trimestres: banxico_trimestres # B tipada: un renglón por trimestre
  dominios_lista: dominios_lista # D: un renglón por dominio
  calidad_columnas: calidad_columnas # diagnóstico: faltantes, ceros, distintos y rango por columna
  calidad_valores: calidad_valores # diagnóstico: frecuencia de cada valor en columnas de texto con pocas categorías
  calidad_dominios: calidad_dominios # diagnóstico: dominios de correo de A frente a la lista D
  calidad_resumen: calidad_resumen # diagnóstico: duplicados, consistencia de Banxico y otras pruebas

# Conteos de la fuente completa, calculados por el equipo en Kaggle en E1.
# La verificación previa del pipeline compara contra ellos.
esperado:
  ieee_transaccion_filas: 590540
  ieee_identidad_filas: 144233
  ieee_fraudes: 20663

# Solo para cargar staging en un proyecto propio (bootstrap/cargar_staging.py).
bootstrap:
  bucket: gs://pagos-lumen-dw-datos # cambiar si se usa otro proyecto
  ieee_transaccion_csv: ieee/train_transaction.csv
  ieee_identidad_csv: ieee/train_identity.csv
  esquema_transaccion: esquemas/ieee_train_transaction.json
  esquema_identidad: esquemas/ieee_train_identity.json
  banxico_csv: data/sample/banxico_cf621_series.csv # tal como se exportó del SIE
  esquema_banxico: esquemas/banxico_cf621_series.json
  dominios_json: data/sample/free_email_domains_1.13.0.json
  esquema_dominios: esquemas/free_email_domains.json

# Datos de versión de las fuentes, que no salen de las tablas.
fuentes:
  dominios_version: "1.13.0" # free-email-domains, descargada y cargada el 9 de octubre de 2026
  dominios_fecha_carga: "2026-10-09"

supuestos:
  # Referencia de TransactionDT (supuesto de E1, discusión 102157 de Kaggle; la fuente no la confirma)
  fecha_referencia_ieee: "2017-12-01"

semilla: 2026

# Archivos de data/sample/ generados por bootstrap/generar_muestras.py (solo para ver el
# esquema y probar código; el análisis usa los datos completos en BigQuery).
muestra:
  sintetico_transacciones: 1000 # IEEE-CIS sintético: valores inventados, no son transacciones reales
  sintetico_pct_identidad: 0.25
  sintetico_pct_fraude: 0.035
  ulb_filas: 1000 # muestra aleatoria simple de la fuente C

tramo_revisado: 0.0075 # 300 de 40,000: capacidad diaria como proporción del flujo (E0)

# Pendiente (fase A2/B): partición temporal por día relativo.
particion: {}

umbrales:
  # Diagnóstico (fase A1): columnas de texto con a lo más este número de valores
  # distintos se listan valor por valor en calidad_valores.
  calidad_max_categorias: 20
  # Pendiente (fase B): umbrales de χ², V de Cramér, correlación y PCA.

# Análisis exploratorio (fase A2): eda/run_eda.py. No es un paso del pipeline.
eda:
  extracto: eda/cache/extracto.parquet # columnas del dataset analítico; contiene datos reales: NO se sube
  columnas:
    [
      TransactionID,
      isFraud,
      TransactionDT,
      dia_relativo,
      hora,
      TransactionAmt,
      ProductCD,
      card1,
      card4,
      card6,
      P_emaildomain,
      DeviceType,
      tiene_identidad,
      D1,
      C1,
    ]
  periodo_dias: 30 # bloques de días relativos (1-30, 31-60, ...); el último absorbe el resto
  periodos: 6
  recorte_media: 0.10 # media recortada al 10 % (se quita el 10 % de cada extremo)
  percentiles: [1, 5, 10, 25, 50, 75, 90, 95, 99]
  min_filas_categoria: 1000 # figura de tasas: se omiten categorías con menos filas (tasa inestable)
  umbral_otros: 0.01
  # Escenarios de prevalencia para ajustar los aciertos del tramo (ilustrativos, no son la
  # prevalencia de una institución): 1 % y 0.39 % (contracargos por número en comercio
  # electrónico, Banxico CF621, ene-mar 2026; incluye contracargos que no son fraude).
  prevalencias_escenario: [0.01, 0.0039] # entropía de P_emaildomain agrupada: dominios con menos del 1 % de las filas -> «Otros»
  tablas: salidas/eda # relativa a pipeline/
  figuras: ../entregas/E2_eda_preparacion/img/eda # relativa a pipeline/

# Resultados agregados que el pipeline escribe para citarlos en el sitio
# (conteos por columna; nunca filas de datos). Sí se suben al repositorio.
salidas:
  carpeta: salidas # relativa a pipeline/

registro:
  carpeta: logs # relativa a pipeline/; no se sube al repositorio
